<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBEY 7 OFFICIAL</title>
    <!-- Liên kết CSS riêng -->
    <link rel="stylesheet" href="public/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>

<body>

    <div class="book-container">
        <!-- Thêm class 'closed' ban đầu để căn giữa bìa -->

            <!-- Nội dung sách được render tự động qua JS -->
        </div>

        <span id="page-indicator">Bìa sách</span>
        <button id="next-btn">Mở sách / Trang sau</button>

    <script src="public/js/script.js"></script>
